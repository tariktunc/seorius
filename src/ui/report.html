<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Seorius report</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="report">
  <header class="r-head">
    <div class="p-brand"><img src="icons/icon32.png" alt="" width="28" height="28"><strong>Seorius</strong></div>
    <div id="r-meta" class="r-meta"></div>
    <div class="p-actions">
      <button id="rescan" type="button" data-i18n="btn_rescan">Rescan</button>
      <button id="print" type="button" data-i18n="btn_print">Print / PDF</button>
    </div>
  </header>
  <div class="r-layout">
    <nav id="r-nav" class="r-nav"></nav>
    <main id="r-main" class="r-main"></main>
  </div>
  <script src="report.js"></script>
</body>
</html>
