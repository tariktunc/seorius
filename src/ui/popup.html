<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Seorius</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="popup">
  <header class="p-head">
    <div class="p-brand"><img src="icons/icon32.png" alt="" width="26" height="26"><strong>Seorius</strong></div>
    <div class="p-actions">
      <button id="rescan" type="button" data-i18n="btn_rescan">Rescan</button>
      <button id="report" type="button" class="primary" data-i18n="btn_full_report">Open full report</button>
    </div>
  </header>
  <section id="summary" class="p-summary"></section>
  <section class="p-overlays">
    <span data-i18n="overlay_title">Highlight on page</span>
    <label><input type="checkbox" data-overlay="headings"> <span data-i18n="overlay_headings">Headings</span></label>
    <label><input type="checkbox" data-overlay="links"> <span data-i18n="overlay_links">Links</span></label>
    <label><input type="checkbox" data-overlay="images"> <span data-i18n="overlay_images">Images</span></label>
  </section>
  <nav class="tabs" id="tabs" role="tablist"></nav>
  <main id="panel" class="p-panel"></main>
  <footer class="p-foot"><a href="#" id="options" data-i18n="btn_settings">Settings</a><a href="https://blakfy.com/" target="_blank" rel="noopener noreferrer" class="credit" data-i18n="operated_by">Operated by Blakfy Studio</a></footer>
  <script src="popup.js"></script>
</body>
</html>
